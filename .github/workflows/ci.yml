name: Practical MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter-01-python:
    name: Chapter 1 - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: chapters/01-introduction-to-mlops/labs/python-ci-scaffold

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: chapters/01-introduction-to-mlops/labs/python-ci-scaffold/requirements.txt

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make format-check

      - name: Lint code
        run: make lint

      - name: Run tests
        run: make test

  chapter-01-container:
    name: Chapter 1 - Container Build
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: chapters/01-introduction-to-mlops/labs/python-ci-scaffold

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: |
          docker build \
            --tag practical-mlops-ch01:ci \
            .

      - name: Run container image
        run: |
          docker run \
            --rm \
            practical-mlops-ch01:ci
